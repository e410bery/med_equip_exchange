<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout · Med Equip Exchange</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <a class="brand" href="/">
      MedEquip Exchange
    </a>

    <nav aria-label="Main navigation">
      <a href="/">Home</a>
      <a href="/products">Browse equipment</a>
      <a href="/docs/cart.html">Cart</a>
    </nav>

    <div id="account"></div>
  </header>

  <main>
    <p><a href="cart.html">← Back to cart</a></p>
    <h1>Checkout</h1>
    <div id="error" class="banner error" role="alert" hidden></div>
    <p id="loading" class="muted" role="status">Loading your order…</p>

    <div id="checkout-layout" class="cart-layout" hidden>
      <div class="stack">
        <!-- Filled in by js/checkout.js from GET /api/me -->
        <section class="card">
          <h2>Ship to</h2>
          <address id="ship-to"></address>
          <p class="muted">Wrong address? <a href="user.html">Edit your profile</a></p>
        </section>

        <!-- Filled in by js/checkout.js from GET /api/cart -->
        <section class="card">
          <h2>Items</h2>
          <div id="review-lines"></div>
        </section>
      </div>

      <aside class="card summary">
        <h2>Payment</h2>
        <dl>
          <dt>Items</dt><dd id="item-count"></dd>
          <dt class="total">Order total</dt><dd id="total" class="total"></dd>
          <dt>Your balance</dt><dd id="balance"></dd>
          <dt>Balance after order</dt><dd id="balance-after"></dd>
        </dl>
        <div id="checkout-blocked" class="banner warn" hidden></div>
        <button id="place-order" type="button">Place order</button>
        <p class="muted small">The total is paid from your account balance.</p>
      </aside>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/checkout.js"></script>
</body>
</html>
